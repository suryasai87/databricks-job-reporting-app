bundle:
  name: job-monitor-serverless-tags

workspace:
  host: https://fe-vm-hls-amer.cloud.databricks.com

variables:
  catalog:
    description: Unity Catalog name
    default: main

  schema:
    description: Schema name
    default: default

  warehouse_id:
    description: SQL Warehouse ID for system table queries
    default: "4b28691c780d9875"

  genie_space_id:
    description: Genie Space ID for AI Assistant
    default: "01f0dde07de71fd3a4c0b4907fe15554"

  lakebase_instance_id:
    description: Lakebase database instance ID for accelerated queries
    default: "6b59171b-cee8-4acc-9209-6c848ffbfbfe"

  serverless_tag_catalog:
    description: Catalog containing serverless tag correlation tables
    default: main

  serverless_tag_schema:
    description: Schema containing serverless tag correlation tables
    default: serverless_tagging

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev

  staging:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/staging

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Applications/${bundle.name}
